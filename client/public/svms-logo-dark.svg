<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Smart Visitor Management System</title>
  <desc id="desc">A clean navy campus gate with a teal verification mark, beside the Smart Visitor Management System wordmark.</desc>

  <!-- Symbol: campus entrance framed by a simple shield-like arch -->
  <g id="mark" transform="translate(12 8)">
    <path d="M64 4 116 24v39c0 34-21 59-52 77C33 122 12 97 12 63V24L64 4Z"
          stroke="#E6EEF5" stroke-width="5" stroke-linejoin="round"/>
    <!-- Gate roof -->
    <path d="M35 53 64 33l29 20" stroke="#E6EEF5" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gate pillars and threshold -->
    <path d="M42 57v36M64 57v36M86 57v36M34 96h60"
          stroke="#E6EEF5" stroke-width="5" stroke-linecap="round"/>
    <!-- Verified entry -->
    <path d="m65 111 10 10 20-22" stroke="#28A995" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark" fill="#E6EEF5">
    <text x="160" y="65" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif"
          font-size="35" font-weight="700" letter-spacing="-1.1">Smart Visitor</text>
    <text x="162" y="99" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif"
          font-size="21" font-weight="600" letter-spacing="2.1">MANAGEMENT SYSTEM</text>
    <path d="M162 116h36" stroke="#28A995" stroke-width="4" stroke-linecap="round"/>
    <text x="209" y="121" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif"
          font-size="11" font-weight="600" letter-spacing="1.55" fill="#9DB2C4">CAMPUS ACCESS · VISIBILITY · CONTROL</text>
  </g>
</svg>
